[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hh-resume-raiser"
version = "0.1.0"
description = "Local Playwright manager for personal resume activity and freshness on HH.ru"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "jmp-ff25" },
]
dependencies = [
    "playwright>=1.62,<2",
    "xlsxwriter>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.12,<1",
]

[project.scripts]
hh-resume-raiser = "hh_raiser.cli:main"

[project.urls]
Repository = "https://github.com/jmp-ff25/HHRaiser"

[tool.setuptools.packages.find]
include = ["hh_raiser*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".agents"]
