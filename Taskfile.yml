version: "3"

vars:
  STATE_DIR: state/main
  CONFIG_FILE: "{{.STATE_DIR}}/hh-config.ini"
  PROFILE_DIR: "{{.STATE_DIR}}/browser-profile"
  COMMON_ARGS: >-
    --config-file "{{.CONFIG_FILE}}" --profile-dir "{{.PROFILE_DIR}}"
  ACTIVITY_ARGS: --full-activity
  RESUME_REFRESH_ARGS: --resume-index-refresh
  RESPONSE_ARGS: --auto-respond

# Кэш uv хранится рядом с исходным кодом, а не в пользовательском профиле Windows.
# Это делает установку переносимой и позволяет удалить все служебные файлы вместе
# с каталогом проекта.
env:
  UV_CACHE_DIR: "{{.TASKFILE_DIR}}/.uv-cache"
  PLAYWRIGHT_BROWSERS_PATH: "{{.TASKFILE_DIR}}/{{.STATE_DIR}}/playwright-browsers"

tasks:
  default:
    desc: Показать доступные команды
    cmds:
      - task --list

  install:
    desc: Установить зависимости, Chromium и проверить подготовленную конфигурацию
    cmds:
      - uv sync --locked
      - uv run --locked playwright install chromium
      - task: prepare-config
      - task: prepare-env
      - uv run --locked hhraiser setup

  setup:
    desc: Псевдоним install для первичной установки
    cmds:
      - task: install

  install-dev:
    desc: Установить приложение с инструментами разработки и Chromium
    cmds:
      - uv sync --locked --extra dev
      - uv run --locked playwright install chromium
      - task: prepare-config
      - task: prepare-env

  install-browser:
    desc: Установить Chromium для Playwright
    cmds:
      - uv run --locked playwright install chromium

  install-system-deps:
    desc: Установить системные зависимости Chromium на Linux
    platforms: [linux]
    cmds:
      - uv run --locked playwright install-deps chromium

  prepare-config:
    desc: Создать локальную конфигурацию из шаблона, если её ещё нет
    env:
      HH_TASK_CONFIG_FILE: "{{.CONFIG_FILE}}"
    status:
      - test -f "{{.CONFIG_FILE}}"
    cmds:
      - >-
        uv run --locked python -c
        "import os; from pathlib import Path;
        source = Path('hh-config.example.ini');
        target = Path(os.environ['HH_TASK_CONFIG_FILE']);
        target.parent.mkdir(parents=True, exist_ok=True);
        target.write_bytes(source.read_bytes())"

  prepare-env:
    desc: Создать локальный файл секретов из шаблона, если его ещё нет
    env:
      HH_TASK_ENV_FILE: .env
    status:
      - test -f ".env"
    cmds:
      - >-
        uv run --locked python -c
        "import os; from pathlib import Path;
        source = Path('.env.example');
        target = Path(os.environ['HH_TASK_ENV_FILE']);
        target.write_bytes(source.read_bytes())"

  init-session:
    desc: Открыть Chromium для первичной авторизации и сохранить сессию
    cmds:
      - >-
        uv run --locked hh-resume-raiser --once --dry-run
        {{.COMMON_ARGS}} {{.CLI_ARGS}}

  init-session-cdp:
    desc: Открыть Chromium с локальным CDP для отладки страницы входа
    cmds:
      - >-
        uv run --locked hh-resume-raiser --once --dry-run --debug-cdp-port 9222
        {{.COMMON_ARGS}} {{.CLI_ARGS}}

  login-captcha-e2e:
    desc: Проверить локаторы CAPTCHA в уже открытом CDP-сеансе без действий на странице
    env:
      HH_LIVE_LOGIN_CAPTCHA_E2E: "1"
      HH_LIVE_CDP_PORT: "9222"
    cmds:
      - uv run --locked --extra dev python -m unittest tests.test_login_captcha_live -v

  check-login:
    desc: Проверить учётные данные во временном профиле
    cmds:
      - >-
        uv run --locked hh-resume-raiser --check-login
        {{.COMMON_ARGS}} {{.CLI_ARGS}}

  raise:
    desc: Непрерывно поднимать резюме в фоновом режиме
    cmds:
      - >-
        uv run --locked hh-resume-raiser --headless
        {{.COMMON_ARGS}} {{.CLI_ARGS}}

  raise-ui:
    desc: Непрерывно поднимать резюме в видимом Chromium
    cmds:
      - >-
        uv run --locked hh-resume-raiser
        {{.COMMON_ARGS}} {{.CLI_ARGS}}

  activity:
    desc: Поднимать резюме и просматривать вакансии в фоновом режиме
    cmds:
      - >-
        uv run --locked hh-resume-raiser --headless
        {{.ACTIVITY_ARGS}} {{.COMMON_ARGS}} {{.CLI_ARGS}}

  activity-ui:
    desc: Поднимать резюме и просматривать вакансии в видимом Chromium
    cmds:
      - >-
        uv run --locked hh-resume-raiser
        {{.ACTIVITY_ARGS}} {{.COMMON_ARGS}} {{.CLI_ARGS}}

  activity-once:
    desc: Выполнить один цикл просмотра в видимом Chromium
    cmds:
      - >-
        uv run --locked hh-resume-raiser --once
        {{.ACTIVITY_ARGS}} {{.COMMON_ARGS}} {{.CLI_ARGS}}

  activity-responses:
    desc: Просматривать вакансии и безопасно откликаться без обязательных форм
    cmds:
      - >-
        uv run --locked hh-resume-raiser --headless
        {{.ACTIVITY_ARGS}} {{.RESPONSE_ARGS}}
        {{.COMMON_ARGS}} {{.CLI_ARGS}}

  activity-responses-ui:
    desc: Видимый режим просмотра и безопасных откликов
    cmds:
      - >-
        uv run --locked hh-resume-raiser
        {{.ACTIVITY_ARGS}} {{.RESPONSE_ARGS}}
        {{.COMMON_ARGS}} {{.CLI_ARGS}}

  full-activity:
    desc: Запустить все возможности и безопасные отклики в фоновом режиме
    cmds:
      - >-
        uv run --locked hh-resume-raiser --headless
        {{.ACTIVITY_ARGS}} {{.RESUME_REFRESH_ARGS}} {{.RESPONSE_ARGS}}
        {{.COMMON_ARGS}} {{.CLI_ARGS}}

  full-activity-ui:
    desc: Запустить все возможности и безопасные отклики в видимом Chromium
    cmds:
      - >-
        uv run --locked hh-resume-raiser
        {{.ACTIVITY_ARGS}} {{.RESUME_REFRESH_ARGS}} {{.RESPONSE_ARGS}}
        {{.COMMON_ARGS}} {{.CLI_ARGS}}

  full-activity-responses:
    desc: Запустить все возможности и безопасные отклики в фоновом режиме
    cmds:
      - >-
        uv run --locked hh-resume-raiser --headless
        {{.ACTIVITY_ARGS}} {{.RESUME_REFRESH_ARGS}} {{.RESPONSE_ARGS}}
        {{.COMMON_ARGS}} {{.CLI_ARGS}}

  full-activity-responses-ui:
    desc: Запустить все возможности и безопасные отклики в видимом Chromium
    cmds:
      - >-
        uv run --locked hh-resume-raiser
        {{.ACTIVITY_ARGS}} {{.RESUME_REFRESH_ARGS}} {{.RESPONSE_ARGS}}
        {{.COMMON_ARGS}} {{.CLI_ARGS}}

  full-activity-once:
    desc: Выполнить один полный цикл в видимом Chromium
    cmds:
      - >-
        uv run --locked hh-resume-raiser --once
        {{.ACTIVITY_ARGS}} {{.RESUME_REFRESH_ARGS}}
        {{.COMMON_ARGS}} {{.CLI_ARGS}}

  resume-index-e2e-ui:
    desc: Визуально проверить обратимое добавление и удаление точки в резюме
    env:
      HH_LIVE_RESUME_INDEX_E2E: "1"
      HH_LIVE_RESUME_INDEX_HEADLESS: "false"
    cmds:
      - uv run --locked --extra dev python -m unittest tests.test_resume_index_live -v

  full-activity-reset-history:
    desc: Начать новое поколение истории и запустить полный фоновый режим
    cmds:
      - >-
        uv run --locked hh-resume-raiser --headless --reset-vacancy-history
        {{.ACTIVITY_ARGS}} {{.RESUME_REFRESH_ARGS}}
        {{.COMMON_ARGS}} {{.CLI_ARGS}}

  help:
    desc: Показать все низкоуровневые параметры приложения
    cmds:
      - uv run --locked hh-resume-raiser --help

  log-colors:
    desc: Показать палитру уровней и категорий логов без запуска браузера
    cmds:
      - uv run --locked python -m hh_raiser.log_color_demo

  bot:
    desc: Запустить Telegram-панель управления экземплярами HHRaiser
    cmds:
      - >-
        uv run --locked hh-resume-raiser-bot

  server-install:
    desc: Установить systemd-службы HHRaiser на Debian/Ubuntu
    platforms: [linux]
    cmds:
      - sudo ./scripts/install-ubuntu.sh
      - task: server-start

  server-start:
    desc: Запустить основной экземпляр и Telegram-бота через systemd
    platforms: [linux]
    cmds:
      - uv run --locked hhraiser start

  server-stop:
    desc: Остановить основной экземпляр и Telegram-бота через systemd
    platforms: [linux]
    cmds:
      - uv run --locked hhraiser stop

  server-restart:
    desc: Перезапустить основной экземпляр и Telegram-бота через systemd
    platforms: [linux]
    cmds:
      - task: server-stop
      - task: server-start

  server-status:
    desc: Показать состояние systemd-служб HHRaiser
    platforms: [linux]
    cmds:
      - uv run --locked hhraiser status

  server-logs:
    desc: Показать последние записи журналов systemd; LINES=100 по умолчанию
    platforms: [linux]
    vars:
      LINES: '{{default "100" .LINES}}'
    cmds:
      - uv run --locked hhraiser logs --lines {{.LINES}}

  server-logs-follow:
    desc: Показывать новые записи журналов systemd в реальном времени
    platforms: [linux]
    cmds:
      - >-
        journalctl --follow --unit hhraiser@main.service --unit hhraiser-bot.service
        --output=cat

  server-update:
    desc: Подтянуть код, синхронизировать зависимости и перезапустить службы
    platforms: [linux]
    cmds:
      - uv run --locked hhraiser update
      - task: server-restart

  server-reconfigure:
    desc: Проверить .env и hh-config.ini перед запуском systemd-служб
    platforms: [linux]
    cmds:
      - uv run --locked hhraiser reconfigure

  format:
    desc: Отформатировать Python-код
    cmds:
      - uv run --locked --extra dev ruff format hh_raiser tests hh_resume_raiser.py

  lint:
    desc: Проверить Python-код линтером
    cmds:
      - uv run --locked --extra dev ruff check .

  test:
    desc: Запустить все автоматические тесты
    cmds:
      - uv run --locked --extra dev python -m unittest discover -s tests -v

  check:
    desc: Последовательно выполнить линтер и тесты
    cmds:
      - task: lint
      - task: test

  build:
    desc: Собрать wheel и исходный архив
    cmds:
      - uv lock --check
      - uv build

  diagram-install:
    desc: Установить зависимости интерактивной архитектурной схемы
    dir: architecture-viewer
    cmds:
      - npm ci

  diagram-dev:
    desc: Запустить интерактивную схему в режиме разработки
    dir: architecture-viewer
    cmds:
      - npm run dev

  diagram-build:
    desc: Собрать автономную интерактивную схему для офлайн-просмотра
    dir: architecture-viewer
    cmds:
      - npm run build

  diagram-test:
    desc: Проверить модель интерактивной архитектурной схемы
    dir: architecture-viewer
    cmds:
      - npm test

  diagram-check:
    desc: Проверить и собрать интерактивную архитектурную схему
    cmds:
      - task: diagram-test
      - task: diagram-build
