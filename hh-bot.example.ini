[telegram]
# Разрешённые Telegram user ID. Обязательно укажите собственный ID перед запуском.
# Несколько значений можно перечислить через пробел или запятую.
# Переменная HHRAISER_BOT_ALLOWED_USER_IDS имеет приоритет над этим значением.
allowed_user_ids =

# Сколько последних строк системного журнала показывать за один запрос.
log_lines = 25

# Автоматическая сводка в личный чат, в минутах. 0 полностью отключает рассылку.
summary_interval_minutes = 360

# true — управлять службами текущего Linux-пользователя через systemctl --user.
user_systemd = true

[instance:main]
# Понятное название, которое будет видно в Telegram.
name = Основное резюме
# Только заранее настроенная служба может быть запущена или остановлена ботом.
service = hhraiser@main.service
# В этом каталоге находятся status.json, SQLite и Excel-журнал экземпляра.
state_dir = /var/lib/hhraiser/main
# Изменяемый через Telegram конфиг обязан находиться внутри state_dir.
config_file = /var/lib/hhraiser/main/hh-config.ini
