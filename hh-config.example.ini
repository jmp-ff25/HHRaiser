[resume]
# Точное название вашего резюме на HH.ru.
title = Название резюме

[browser]
# Размер области страницы в фоновом Chromium. По умолчанию 1920x1200 (16:10).
# В видимом режиме окно разворачивается по размеру монитора.
viewport_width = 1920
viewport_height = 1200

[activity]
# Поисковые запросы: одно значение на строку. Укажите профессию и альтернативные названия.
search_queries =
    Название профессии
    Альтернативное название профессии

# Желаемый максимальный размер группы с паузой между группами.
# Например, 9 вакансий при значении 5 будут разделены на группы 5 + 4.
vacancies_per_group = 5
# Пауза между завершением одной группы вакансий и началом следующей, в секундах.
# По умолчанию 300 (5 минут). Допустимо от 1 до 86400.
activity_interval_seconds = 300
# Максимум страниц выдачи для каждого поискового запроса за цикл: от 1 до 200.
search_pages_per_cycle = 25

[search_filters]
# Слова, которых не должно быть в результатах. Одно значение на строку.
excluded_words =
# Названия регионов, по одному на строку. ID определяется по актуальному справочнику HH.
# Пусто — все регионы.
areas =
    Москва

[matching]
# Оценивать соответствие вакансии выбранному резюме перед возможным откликом.
enabled = true
# Модель Polza AI и её адрес; ключ задаётся в .env.
model = deepseek/deepseek-v4.1-flash
api_url = https://polza.ai/api/v1
# Если параметр prompt отсутствует, используется общий промпт проекта.
# Пример собственного промпта (раскомментируйте вместе с отступами):
# prompt =
#     Определи основную профессию и задачи вакансии.
#     Сравни их с подтверждённым опытом в резюме, учитывай переносимые навыки.
#     Ответь JSON: verdict (fit/unsure/unfit), reason, gaps.

[responses]
# В full-activity автоматические отклики включены по умолчанию.
# Укажите false, если нужны только просмотры вакансий без откликов.
# Анкеты, тесты, обязательные письма и внешние сайты всегда остаются владельцу.
enabled = true
# Максимум успешно отправленных откликов за календарный день по Москве.
# 0 означает отсутствие дневного ограничения.
daily_limit = 0

[captchasolution]
# Включить до пяти попыток Gemini перед ручным подтверждением CAPTCHA.
enabled = false
# Запускать платный интеграционный тест Gemini вместе с обычными тестами.
integration_test_enabled = false
# Промпт для решения капчи
ocr_prompt='Точно перепиши русскую CAPTCHA. На ней РОВНО два слова строчными буквами. Исходная CAPTCHA — источник истины, варианты выпрямления служат только подсказкой. Не исправляй странные слова по смыслу. Ответь только JSON без Markdown: {"text":"первое второе","confidence":0.00}.'
# URL API и используемая модель можно менять без правки кода.
api_url = "https://polza.ai/api/v1"
model = "google/gemini-3.8-flash"
