[resume]
# Точное название вашего резюме на HH.ru.
title = Название резюме

[activity]
# Один поисковый запрос на строку. Можно указать любую профессию и несколько вариантов.
search_queries =
    Название профессии
    Альтернативное название профессии

# Сколько страниц выдачи разрешено проверить за один цикл, чтобы набрать новые вакансии.
search_pages_per_cycle = 25
# После скольких успешных уникальных просмотров начать новый цикл.
# Значение 0 отключает лимит.
unique_vacancy_limit = 1000
# Не выбирать вакансию повторно раньше указанного числа дней. 0 отключает паузу.
revisit_after_days = 14
# Начинать новый цикл уникальных просмотров после прохода известных страниц всех запросов.
reset_on_exhaustion = true

[search_filters]
# Слова, которых не должно быть в результатах. Одно значение на строку.
excluded_words =
# Где HH должен искать слова из search_queries. Пусто — стандартное поведение HH.
# Допустимо: name, company_name, description.
search_fields =
# Допустимо: noExperience, between1And3, between3And6, moreThan6.
experience =
# Названия регионов, по одному на строку. ID определяется по актуальному справочнику HH.
# Пусто — все регионы.
areas =
    Москва

[matching]
# Оценивать соответствие вакансии выбранному резюме до прокрутки и просмотра.
enabled = true
# Минимальная расчётная оценка совместимости для просмотра: от 0 до 100.
threshold = 55

[responses]
# Явное включение автоматических откликов. По умолчанию функция отключена.
# Анкеты, тесты, обязательные письма и внешние сайты всегда остаются владельцу.
enabled = false
# Максимум успешно отправленных откликов за календарный день по Москве.
# 0 означает отсутствие дневного ограничения.
daily_limit = 0
