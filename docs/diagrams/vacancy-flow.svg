<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 405" role="img" aria-labelledby="title desc">
<title id="title">HHRaiser — оценка вакансий через Polza AI</title>
<desc id="desc">Поиск вакансий, проверка сохранённого решения, платная оценка новой вакансии, просмотр и отклик только при новом решении подходит.</desc>
<defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#1e293b}.box{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.decision{fill:#fff7e8;stroke:#c27a12;stroke-width:2}.good{fill:#ecfdf5;stroke:#1d9a72;stroke-width:2}.arrow{fill:none;stroke:#64748b;stroke-width:2.5;marker-end:url(#head)}.small{font-size:16px}.label{font-size:20px;font-weight:600}</style><marker id="head" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 Z" fill="#64748b"/></marker></defs>
<rect width="1280" height="405" fill="white"/>
<rect class="box" x="35" y="70" width="205" height="100" rx="12"/><text class="label" x="58" y="109">Поиск HH</text><text class="small" x="58" y="139">Публичный ID вакансии</text>
<rect class="decision" x="285" y="70" width="215" height="100" rx="12"/><text class="label" x="308" y="109">SQLite</text><text class="small" x="308" y="139">Оценка уже есть?</text>
<rect class="box" x="550" y="70" width="225" height="100" rx="12"/><text class="label" x="573" y="109">Polza AI</text><text class="small" x="573" y="139">Оценить новую вакансию</text>
<rect class="box" x="815" y="70" width="195" height="100" rx="12"/><text class="label" x="837" y="109">SQLite</text><text class="small" x="837" y="139">Сохранить ответ</text>
<rect class="good" x="1055" y="70" width="190" height="100" rx="12"/><text class="label" x="1077" y="109">Просмотр</text><text class="small" x="1077" y="139">Открыть и прокрутить</text>
<path class="arrow" d="M240 120 H280"/><path class="arrow" d="M500 120 H545"/><path class="arrow" d="M775 120 H810"/><path class="arrow" d="M1010 120 H1050"/>
<text class="small" x="510" y="106">нет</text>
<path class="arrow" d="M390 175 V252 H1140 V175"/><text class="small" x="530" y="240">Да: без повторного запроса и без отклика</text>
<rect class="decision" x="810" y="290" width="205" height="85" rx="12"/><text class="label" x="829" y="328">Новый fit?</text><text class="small" x="829" y="354">Автоотклик включён?</text>
<rect class="good" x="1055" y="290" width="190" height="85" rx="12"/><text class="label" x="1077" y="327">Безопасный</text><text class="small" x="1077" y="353">отклик HH</text>
<path class="arrow" d="M1150 175 V250 H910 V285"/><path class="arrow" d="M1015 332 H1050"/><text class="small" x="763" y="278">после просмотра</text><text class="small" x="1020" y="320">да</text>
<text class="small" x="40" y="362">Все вакансии просматриваются. При unsure, unfit, ошибке API и повторной оценке отклика нет.</text>
</svg>